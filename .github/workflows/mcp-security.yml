name: MCP Security Scan & Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-scan:
    name: ruff + mypy + pytest + mcp-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "pytest-asyncio>=0.23" "ruff==0.17.6" "mypy==2.4.1"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy --strict, config in pyproject.toml)
        run: mypy src

      - name: Run pytest suite (incl. adversarial + no-float-in-domain rule)
        env:
          PYTHONPATH: .
        run: python -m pytest -p no:cacheprovider -v --tb=short tests/

      - name: Run MCP security scan
        uses: nhomyk/mcp-scan-action@v1
        with:
          path: src/mcp_server/server.py
        continue-on-error: true
