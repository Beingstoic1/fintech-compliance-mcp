name: MCP Security Scan & Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-scan:
    name: pytest + mcp-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mcp pydantic streamlit pandas pytest pytest-asyncio

      - name: Run pytest suite
        run: pytest -v --tb=short tests/

      - name: Run MCP security scan
        uses: nhomyk/mcp-scan-action@v1
        with:
          path: src/mcp_server/server.py
        continue-on-error: true
