[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintech-compliance-mcp"
version = "1.0.0"
description = "Zero-trust fintech compliance MCP server with hash-chained audit ledger"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyjwt>=2.10",
    "pydantic>=2.0",
    "streamlit>=1.35",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
